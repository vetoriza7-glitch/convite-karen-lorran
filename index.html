<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite de Casamento - Karen e Lorran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- ÁREA DO CONVITE ABERTO (Fica atrás da capa) -->
        <div class="invitation-open">
            <img src="convite_aberto.png" alt="Convite Aberto Karen e Lorran" class="bg-open">
            
            <!-- Botões Interativos -->
<div class="buttons-container">
    <a href="#" target="_blank" class="btn-link">
        <img src="images/botao-local.png" alt="Local da Cerimônia" class="btn-img">
        <span class="btn-text">Local da<br>Cerimônia</span>
    </a>
    
    <a href="#" target="_blank" class="btn-link">
        <img src="images/botao-lista.png" alt="Lista de Presentes" class="btn-img">
        <span class="btn-text">Lista de<br>Presentes</span>
    </a>
</div>

<!-- ÁREA DA CAPA (Dividida em duas portas) -->
<div class="cover-wrapper" id="coverWrapper">
    
    <!-- Lado Esquerdo da Capa -->
    <div class="door door-left">
        <img src="capa-esquerda.png" alt="Capa Esquerda">
    </div>
    
    <!-- Lado Direito da Capa -->
    <div class="door door-right">
        <img src="capa-direita.png" alt="Capa Direita">
    </div>

    <!-- O Selo Clicável no Centro -->
    <div class="seal-container" id="sealBtn">
        <img src="selo.png" alt="Selo de Cera K L" class="seal-img">
        <p class="seal-text">Clique para abrir</p>
    </div>

</div>

    <script src="script.js"></script>
</body>
</html>
